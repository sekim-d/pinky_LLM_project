services:

  # ── 카메라 서버 (UDP 스트리밍) ────────────────────────────
  camera:
    build: ./pinky_camera
    ports:
      - "9000:9000/udp"
    devices:
      - /dev/video0:/dev/video0
    group_add:
      - video
    restart: unless-stopped

  # ── LLM 웹 서버 (FastAPI) ────────────────────────────────
  llm-web:
    build: ./pinky_LLM_project/pinky_web
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

  # ── Ollama LLM 서버 ───────────────────────────────────────
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull qwen2.5:3b && wait"]
    restart: unless-stopped

volumes:
  ollama_data:
