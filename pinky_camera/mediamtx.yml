logLevel: warn
logDestinations: [stdout]

rtspAddress: :8554
hlsAddress:  :8888

hlsAllowOrigin:     "*"
hlsAlwaysRemux:     yes
hlsSegmentCount:    7
hlsSegmentDuration: 1s
hlsPartDuration:    200ms

paths:
  cam1:
    source: publisher
    runOnInit: ffmpeg -f v4l2 -i /dev/video0 -c:v libx264 -preset ultrafast -tune zerolatency -b:v 1500k -g 15 -sc_threshold 0 -f rtsp rtsp://localhost:8554/cam1
    runOnInitRestart: yes

  # IP 카메라 추가 시 주석 해제 후 IP 수정
  # cam2:
  #   source: rtsp://admin:1234@192.168.1.101:554/stream1
